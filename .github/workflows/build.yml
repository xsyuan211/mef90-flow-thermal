          # mu=4.2294e-4 Pa.s and permField must be exactly 2.36441x the
          # advection control deck. If mu(T) is not read back from the
          # persistent cellMuField Vec, that ratio collapses to 1 or blows up.
          echo "=== Gate 4.6 mu(T) diagnostic run (temp_dep_viscosity=true, ksponly) ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D_viscosity.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason \
