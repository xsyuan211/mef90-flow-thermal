            echo "=== saved material-time result mesh -> /tmp/out_material.gen ==="
          else
            echo "=== WARN: material run produced no result mesh; Gate 4.7 must FAIL ==="
          fi
          # --- Gate 4.9 (hard): batched (uniform-coefficient) assembly ------
          # terzaghi1D_batched.yaml == terzaghi1D.yaml + ONE flow: key
          # (batched_assembly: true). The solver emits deterministic
          # "Gate 4.9: tag=... nCells=N nIS=1 nElem=1 mode=batched" rows for
          # the four optimised assembly loops; the production run emits NONE
          # (default FALSE), which keeps every existing verdict byte-identical.
          echo "=== Gate 4.9 batched-assembly diagnostic run (ksponly) ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D_batched.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason \
            -disp_snes_monitor -disp_snes_linesearch_type basic \
            -disp_snes_type ksponly -disp_snes_converged_reason \
            2>&1 | tee /tmp/terzaghi_batched.log
          s49_rc=${PIPESTATUS[0]}
          echo "=== Gate 4.9 batched mpirun exit code: $s49_rc ==="
          echo "=== Gate 4.9: option as parsed by PetscBag ==="
          grep -aE "^[[:space:]]*batched_assembly[[:space:]]*=" /tmp/terzaghi_batched.log | sort -u | head -3 || true
          echo "=== Gate 4.9: first / last batched-assembly rows ==="
          grep -a "Gate 4.9:" /tmp/terzaghi_batched.log | head -4 || true
          grep -a "Gate 4.9:" /tmp/terzaghi_batched.log | tail -4 || true
          if [ -s data/Beam1x10-tri3_out.gen ]; then
            cp -f data/Beam1x10-tri3_out.gen /tmp/out_batched.gen
            echo "=== saved batched result mesh -> /tmp/out_batched.gen ==="
          else
            echo "=== WARN: batched run produced no result mesh; Gate 4.9 must FAIL ==="
          fi
          # --- Gate 4.14 (hard): 3D dimension dispatch -----------------------
          # Every previous gate ran on Beam1x10-tri3 (num_dim=2). MEF90 also
          # compiles -DMEF90_DIM=3 twins and dispatches on DMMeshGetDimension;
          # MEF90_MATS_IDENTITY (used by Gates 4.1b and 4.9) becomes the
          # 6-component MEF90MatS3DIdentity in 3D. This is the FIRST real
          # exercise of that path. Beam1x10-tetra4.gen has the same cell set
          # labels [1,10,20] and the same 10x1x1 m beam; only the mesh prefix
          # and time.numstep (51 -> 11, same t=0..1 s span) change.
          # CI #120: the 2-rank CG + bjacobi/ILU + rtol 1e-10 chain never
          # finished the FIRST TSSolve on the 2635-node tetra4 mesh inside the
          # 900 s cap (log stops at "0 TS dt 0.1 time 0", EXO truncated at
          # 13,766,716 B). Keep all 11 physical steps and every W1-W7
          # criterion; change only the DIAGNOSTIC solver settings:
          #   -np 1 + bjacobi/sub-LU  -> the single block IS the whole
          #   sequential AIJ matrix, so CG converges in one iteration per
          #   step instead of stalling on a 3D-ill-conditioned ILU(0);
          #   -flow_ksp_monitor makes every completed solve observable.
          # Production 2D decks keep their original -np 2 / ILU chain.
          echo "=== Gate 4.14 3D dimension-dispatch diagnostic run (direct PC) ==="
          timeout -k 10s 1800 mpirun --allow-run-as-root -np 1 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tetra4 \
            -options_file_yaml data/terzaghi1D_dim3.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason -flow_ksp_monitor \
