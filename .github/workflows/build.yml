          # its own 11.  Delete the result mesh before EACH B0 run so vDef takes
          # the EXCRE(EXCLOB) + EXCOPY branch and writes a clean 11-record EXO.
          # /tmp/out_main.gen is restored right after the two runs, so the
          # delivered production artifact is unchanged.
          rm -f data/Beam1x10-tri3_out.gen
          echo "=== Gate 4.15: rebuilt a clean 11-record EXO for the control run ==="
          echo "=== Gate 4.15 B0 similitude-calibrated ZERO-SOURCE control run ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi415_scale.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason -flow_ksp_monitor \
            -disp_snes_type ksponly -disp_snes_converged_reason \
            2>&1 | tee /tmp/terzaghi_415_scale.log
          s415_scale_rc=${PIPESTATUS[0]}
          echo "=== Gate 4.15 B0 control mpirun exit code: $s415_scale_rc ==="
          if [ -s data/Beam1x10-tri3_out.gen ]; then
            cp -f data/Beam1x10-tri3_out.gen /tmp/out_415_scale.gen
            echo "=== saved B0 control result mesh -> /tmp/out_415_scale.gen ==="
          else
            echo "=== WARN: B0 control produced no result mesh; Gate 4.15 must FAIL ==="
          fi
          rm -f data/Beam1x10-tri3_out.gen
          echo "=== Gate 4.15: rebuilt a clean 11-record EXO for the injection run ==="
          echo "=== Gate 4.15 B0 constant-rate INJECTION run (f=1.5e-5 1/s) ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi415_inject.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason -flow_ksp_monitor \
            -disp_snes_type ksponly -disp_snes_converged_reason \
            2>&1 | tee /tmp/terzaghi_415_inject.log
          s415_inject_rc=${PIPESTATUS[0]}
          echo "=== Gate 4.15 B0 injection mpirun exit code: $s415_inject_rc ==="
          echo "=== Gate 4.15: Flow CellSet source as parsed by PetscBag ==="
          grep -aE "^[[:space:]]*source = " /tmp/terzaghi_415_inject.log | sort -u | head -5 || true
          if [ -s data/Beam1x10-tri3_out.gen ]; then
