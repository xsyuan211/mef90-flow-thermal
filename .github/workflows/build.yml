            echo "=== saved source-sign result mesh -> /tmp/out_source.gen ==="
          else
            echo "=== WARN: source run produced no result mesh; Gate 4.4 must FAIL ==="
          fi
          # --- Gate 4.6 (hard): mu(T) alias removal ---------------------------
          # terzaghi1D_viscosity.yaml == terzaghi1D_advection.yaml + ONE option
          # (flow.temp_dep_viscosity: true). The live HeatXfer field (0..100 K)
