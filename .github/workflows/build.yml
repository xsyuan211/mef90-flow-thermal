            echo "=== saved B0 injection result mesh -> /tmp/out_415_inject.gen ==="
          else
            echo "=== WARN: B0 injection produced no result mesh; Gate 4.15 must FAIL ==="
          fi
          # --- Gate 4.15 / Stage B1: Q x S x Gc x k x mu one-factor matrix --
          # Literature: Lecampion, Desroches, Jeffrey & Bunger (2017),
          # JGR Solid Earth, doi:10.1002/2016JB013183. BEFORE fracture
          # initiation Q_in ~ 0 and a constant rate produces a LINEAR
          # pressurisation whose slope Q0/U is set by the injection-system
          # compliance; rock parameters are invisible on that curve. In vDef
          # the compliance is the storativity S, so beta = f/S (CI #125).
          # The six decks are ONE code-line deltas of terzaghi415_inject.yaml;
          # A2-A6 test identifiability LAYERING: beta sees only (f,S), while
          # the phase-field surface energy (C1/C2 ~ Gc) responds to Gc and Q.
          # Each 11-step run MUST delete the result mesh first: CI #124 showed
          # MEF90CtxOpenEXO APPENDS to an existing _out.gen and leaves the
          # 51-record production tail behind. NO Fortran was changed.
          mkdir -p /tmp/gate415b1 /tmp/gate415b2
          rm -f data/Beam1x10-tri3_out.gen
          echo "=== Gate 4.15 B1: qhalf (Q = 0.5 x Q0) ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 -options_file_yaml data/terzaghi415_b1_qhalf.yaml \
            -flow_ts_view -flow_ts_monitor -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason -flow_ksp_monitor \
            -disp_snes_type ksponly -disp_snes_converged_reason \
            2>&1 | tee /tmp/terzaghi_415_b1_qhalf.log
          sb1_qhalf_rc=${PIPESTATUS[0]}
          echo "=== Gate 4.15 B1 qhalf mpirun exit code: $sb1_qhalf_rc ==="
          cp -f data/Beam1x10-tri3_out.gen /tmp/gate415b1/qhalf.gen || true
          cp -f /tmp/terzaghi_415_b1_qhalf.log /tmp/gate415b1/qhalf.log || true
          rm -f data/Beam1x10-tri3_out.gen
          echo "=== Gate 4.15 B1: qdouble (Q = 2 x Q0) ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 -options_file_yaml data/terzaghi415_b1_qdouble.yaml \
            -flow_ts_view -flow_ts_monitor -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason -flow_ksp_monitor \
            -disp_snes_type ksponly -disp_snes_converged_reason \
            2>&1 | tee /tmp/terzaghi_415_b1_qdouble.log
          sb1_qdouble_rc=${PIPESTATUS[0]}
          echo "=== Gate 4.15 B1 qdouble mpirun exit code: $sb1_qdouble_rc ==="
          cp -f data/Beam1x10-tri3_out.gen /tmp/gate415b1/qdouble.gen || true
          cp -f /tmp/terzaghi_415_b1_qdouble.log /tmp/gate415b1/qdouble.log || true
          rm -f data/Beam1x10-tri3_out.gen
          echo "=== Gate 4.15 B1: stor (S = 2 x S_num) ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
