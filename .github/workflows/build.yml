          echo "=== Gate 4.4: Flow CellSet source as parsed by PetscBag ==="
          grep -aE "^[[:space:]]*source = " /tmp/terzaghi_source.log | sort -u | head -5 || true
          if [ -s data/Beam1x10-tri3_out.gen ]; then
