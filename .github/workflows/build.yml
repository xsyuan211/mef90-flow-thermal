          s414_rc=${PIPESTATUS[0]}
          echo "=== Gate 4.14 3D mpirun exit code: $s414_rc ==="
          if [ -s data/Beam1x10-tetra4_out.gen ]; then
            cp -f data/Beam1x10-tetra4_out.gen /tmp/out_dim3.gen
            echo "=== saved 3D result mesh -> /tmp/out_dim3.gen ==="
          else
            echo "=== WARN: 3D run produced no result mesh; Gate 4.14 must FAIL ==="
          fi
          # --- Gate 4.15 / Stage B0 (hard): rate/fracability similitude -----
          # FIRST real exercise of a NON-ZERO flow.source under a shale-like
          # poroelastic time scale.  Two NEW 2D decks, NO Fortran change:
          #   terzaghi415_scale.yaml = production deck + 4 code lines
          #       (numstep 51->11, k 5e-11->2.35e-18, kmax 1e-9->4.70e-17,
          #        S 4.6e-10->1.50e-10) => c_v=1.5667e-5, T(1s)=1.5667e-7
          #   terzaghi415_inject.yaml = scale deck + ONE code line
          #       (cs0001.source 0.0->1.5e-5 [1/s])
          # At T~1.6e-7 the Darcy term is frozen over 1 s (4 mm boundary
          # layer), so the discrete balance is S dp/dt = f and the analytical
          # anchor is p(t) = p0 + (f/S)t with f/S = 1e5 Pa/s.  V4 measures
          # S_eff = f/slope from the real EXO and settles the [1/s] vs [Pa/s]
          # unit ambiguity (PetscBag registers 1/s; an old deck said Pa/s).
          # B0 uses a CONSERVATIVE f so the response stays linear/damage-free;
          # the field-rate window is scanned later in Stage B1.  Production
          # 2D decks and the 3D diagnostic keep their ORIGINAL configuration.
          # CI #124 ROOT CAUSE: MEF90CtxOpenEXO (MEF90/m_MEF90_EXO.F90:125)
          # uses Inquire(file=...,exist=...): when data/Beam1x10-tri3_out.gen
