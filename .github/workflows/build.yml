          echo "=== Gate 4.6 mu(T) mpirun exit code: $s46_rc ==="
          echo "=== Gate 4.6: Flow global bag temp_dep_viscosity as parsed ==="
          grep -aE "^[[:space:]]*temp_dep_viscosity[[:space:]]*=" /tmp/terzaghi_viscosity.log | sort -u | head -5 || true
          if [ -s data/Beam1x10-tri3_out.gen ]; then
            cp -f data/Beam1x10-tri3_out.gen /tmp/out_viscosity.gen
            echo "=== saved mu(T) result mesh -> /tmp/out_viscosity.gen ==="
          else
            echo "=== WARN: mu(T) run produced no result mesh; Gate 4.6 must FAIL ==="
          fi
          # --- Gate 4.7 (hard): time-dependent material parameters -----------
          # terzaghi1D_material.yaml == terzaghi1D.yaml + FOUR flow: keys
          # (perm_scaling/perm_rate/stor_scaling/stor_rate = linear/0.8/
          # linear/0.4). A(t)=A0(1+0.8t) is visible in the EXO perm_field slot,
          # S(t)=S0(1+0.4t) is visible in the Gate 4.7 log rows, and the
          # opposed rates make c_v(t)=c_v0(1+0.8t)/(1+0.4t) so the pressure
          # field separates the "no scaling", "perm only" and "S only" bugs.
          echo "=== Gate 4.7 material-time diagnostic run (linear A(t) and S(t), ksponly) ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D_material.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason \
