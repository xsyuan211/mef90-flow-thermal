name: Build & Test vDef + Darcy Flow
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  compile:
    name: Build + Terzaghi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc g++ gfortran cmake make perl m4 git patch wget curl dos2unix \
            libtool automake tar
      - name: Cache OpenMPI
        id: cache-openmpi
        uses: actions/cache/restore@v4
        with:
          path: ~/openmpi-3.1.3
          key: openmpi-3.1.3-ubuntu-latest-v1
      - name: Build OpenMPI 3.1.3
        if: steps.cache-openmpi.outputs.cache-hit != 'true'
        run: |
          set -e
          export MPI_HOME=$HOME/openmpi-3.1.3
          cd /tmp
          wget -q https://download.open-mpi.org/release/open-mpi/v3.1/openmpi-3.1.3.tar.gz
          tar xzf openmpi-3.1.3.tar.gz
          cd openmpi-3.1.3
          ./configure --prefix=$MPI_HOME 2>&1 | tail -3
          make -j2 2>&1 | tail -3
          make install 2>&1 | tail -3
      - name: Verify OpenMPI
        run: |
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PATH
          mpirun --version
      - name: Cache PETSc deps
        id: cache-petsc-dl
        uses: actions/cache/restore@v4
        with:
          path: ~/petsc-dl
          key: petsc-dl-v1
      - name: Pre-download PETSc deps
        if: steps.cache-petsc-dl.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p $HOME/petsc-dl && cd $HOME/petsc-dl
          wget -q https://github.com/HDFGroup/hdf5/archive/refs/tags/hdf5-1_10_6.tar.gz -O hdf5-1.10.6.tar.gz
          wget -q https://github.com/Unidata/netcdf-c/archive/refs/tags/v4.8.1.tar.gz -O netcdf-v4.8.1.tar.gz
          wget -q https://github.com/sandialabs/seacas/archive/refs/tags/v2021-01-20.tar.gz -O exodusii-2021-01-20.tar.gz
          ls -la
      - name: Cache Miniconda + PETSc build
        id: cache-petsc
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/miniconda2
            ~/petsc-3.3-mef90
          key: petsc-mef90-3.3-ubuntu-latest-v1
      - name: Build PETSc-3.3
        if: steps.cache-petsc.outputs.cache-hit != 'true'
        run: |
          set -e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PATH
          echo "=== Python 2.7 ==="
          wget -q https://repo.anaconda.com/miniconda/Miniconda2-latest-Linux-x86_64.sh -O /tmp/miniconda.sh
          bash /tmp/miniconda.sh -b -p $HOME/miniconda2
          $HOME/miniconda2/bin/conda create -n py27 python=2.7 -y -q
          export PY27=$HOME/miniconda2/envs/py27/bin/python
          $PY27 --version
          echo "=== Clone PETSc mef90-3.3 ==="
          rm -rf $PETSC_DIR
          git clone --single-branch --branch mef90-3.3 https://gitlab.com/blaisebourdin/petsc.git $PETSC_DIR
          cd $PETSC_DIR
          echo "=== Configure ==="
          $PY27 ./configure \
            COPTFLAGS='-O3' CXXOPTFLAGS='-O3' FOPTFLAGS='-O3' \
            FFLAGS='-Wno-aliasing -ffree-line-length-none -fallow-argument-mismatch -Wno-all' \
            --download-hdf5=$HOME/petsc-dl/hdf5-1.10.6.tar.gz \
            --download-netcdf=$HOME/petsc-dl/netcdf-v4.8.1.tar.gz \
            --download-exodusii=$HOME/petsc-dl/exodusii-2021-01-20.tar.gz \
            --download-f-blas-lapack=1 \
            --download-chaco=1 --download-hypre=1 --download-metis=1 \
            --download-ml=1 --download-parmetis=1 --download-sowing=1 \
            --download-yaml=1 --download-boost=1 \
            --with-mpi-dir=$MPI_HOME --with-sieve=1 \
            --with-fortran-datatypes=1 --with-debugging=0 \
            --with-clanguage=C++ --with-shared-libraries=1 \
            --with-c2html=0 --with-x11=0 --with-gnu-compilers=1 2>&1 | tail -20
          echo "=== Make PETSc ==="
          make PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH all 2>&1 | tail -10
      - name: Verify PETSc
        run: |
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          ls $PETSC_DIR/conf/variables
          ls $PETSC_ARCH/conf/petscrules 2>&1 || echo "!! NO petscrules !!"
      - name: Debug PETSc TS module
        run: |
          set +e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          echo "===== conf/variables ARCH refs ====="
          grep -n "PETSC_ARCH\|include\|FPP" $PETSC_DIR/conf/variables 2>&1 | head -30
          echo ""
          echo "===== conf/rules ARCH refs ====="
          grep -n "PETSC_ARCH\|include\|FPP\|-I" $PETSC_DIR/conf/rules 2>&1 | head -30
          echo ""
          echo "===== ls $PETSC_DIR/conf/ ====="
          ls -la $PETSC_DIR/conf/
          echo ""
          echo "===== ls $PETSC_DIR/ $PETSC_ARCH/ ====="
          ls $PETSC_DIR/
          ls $PETSC_DIR/$PETSC_ARCH/
          echo ""
          echo "===== find petscconf.h ====="
          find $PETSC_DIR -name "petscconf.h" 2>&1
          echo ""
          echo "===== find ALL petscts*.mod ====="
          find $PETSC_DIR -name "petscts*.mod" 2>&1
          echo ""
          echo "===== petsctsdef.h90 content ====="
          cat $PETSC_DIR/include/finclude/ftn-custom/petsctsdef.h90 2>&1
          echo ""
          echo "===== petscdef.h FULL content ====="
          cat $PETSC_DIR/include/finclude/petscdef.h 2>&1
          echo ""
          echo "===== petsctsdef.h FULL content ====="
          cat $PETSC_DIR/include/finclude/petsctsdef.h 2>&1
          echo ""
          echo "===== petscbagdef.h FULL content ====="
          cat $PETSC_DIR/include/finclude/petscbagdef.h 2>&1
          echo ""
          echo "===== ALL files in finclude/ ====="
          ls -la $PETSC_DIR/include/finclude/ 2>&1
          echo ""
          echo "===== GREP 'TS' in ALL .h in finclude/ ====="
          grep -rn 'TS\b\|#define TS' $PETSC_DIR/include/finclude/ 2>&1 | head -40
          echo ""
          echo "===== GREP 'PetscFortranAddr' in finclude/ ====="
          grep -rn 'PetscFortranAddr' $PETSC_DIR/include/finclude/ 2>&1 | head -20
          echo ""
          echo "===== petscdef.h line 18 ====="
          sed -n '18p' $PETSC_DIR/include/finclude/petscdef.h 2>&1
      - name: Fix CRLF + Patch Makefiles
        run: |
          find . -type f -name "*.sh" -exec dos2unix -q {} +
          find . -type f -name "Makefile" -exec dos2unix -q {} +
          find . -type f -name "*.F90" -exec dos2unix -q {} +
          find . -type f -name "*.inc" -exec dos2unix -q {} +
          find . -type f -name "*.h" -exec dos2unix -q {} +
          chmod +x bin/makeversion.sh
          echo ""
          echo "===== PATCH MAKEFILES ====="
          for mf in MEF90/Makefile m_DefMech/Makefile m_Flow/Makefile vDef/Makefile; do
            if [ -f "$mf" ]; then
              echo "Patching $mf ..."
              sed -i 's/-@\${FC}/\${FC}/g' "$mf"
              sed -i 's/-@\${FLINKER}/\${FLINKER}/g' "$mf"
            fi
          done
          echo ""
          echo "=== VERIFY patched Makefiles ==="
          for mf in MEF90/Makefile m_DefMech/Makefile m_Flow/Makefile vDef/Makefile; do
            if [ -f "$mf" ]; then
              echo "--- $mf ---"
              grep -n '\${FC}\|\${FLINKER}' "$mf" | head -3
            fi
          done
      - name: Build MEF90 + m_Flow + vDef
        run: |
          set -eo pipefail
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          export MEF90_DIR=$(pwd)
          export FC_FLAGS="-fallow-argument-mismatch -ffree-line-length-none -Wno-error -J$(pwd)/objs/$PETSC_ARCH -I$(pwd)/objs/$PETSC_ARCH -I$PETSC_DIR/$PETSC_ARCH/include"
          export FCPPFLAGS="-DPETSC_USE_FORTRAN_DATATYPES=1 -DPETSC_USE_REAL_DOUBLE=1 -I$PETSC_DIR/include -I$PETSC_DIR/include/finclude -I$PETSC_DIR/$PETSC_ARCH/include"
          export FCFLAGS="-fallow-argument-mismatch"
          export FFLAGS="-fallow-argument-mismatch"
          mkdir -p objs/${PETSC_ARCH} bin/${PETSC_ARCH} lib/${PETSC_ARCH}
          bin/makeversion.sh ${MEF90_DIR}/mef90version.h

          echo ""
          echo "=============================================="
          echo "=== PATCH PETSc conf/variables + petscvariables ==="
          echo "=============================================="

          echo "--- Before: conf/variables key lines ---"
          grep -n "FCPPFLAGS\|PETSC_FCPPFLAGS\|include.*petscvariables" $PETSC_DIR/conf/variables 2>&1 | head -10
          echo ""

          # 1. Patch conf/variables — 放在 include 之后确保覆盖
          cp $PETSC_DIR/conf/variables $PETSC_DIR/conf/variables.bak
          sed -i 's/^PETSC_ARCH *= *.*/PETSC_ARCH = linux-gcc-openmpi-mef90-O/' $PETSC_DIR/conf/variables
          # 删除所有 FCPPFLAGS / PETSC_FCPPFLAGS 定义
          sed -i '/^[[:space:]]*FCPPFLAGS[[:space:]]*=/d' $PETSC_DIR/conf/variables
          sed -i '/^[[:space:]]*PETSC_FCPPFLAGS[[:space:]]*=/d' $PETSC_DIR/conf/variables
          sed -i '/^[[:space:]]*PETSC_FC_INCLUDES[[:space:]]*=/d' $PETSC_DIR/conf/variables
          # 在 include petscvariables 行后面插入我们的 FCPPFLAGS
          sed -i "/include.*petscvariables/a FCPPFLAGS = -DPETSC_USE_FORTRAN_DATATYPES=1 -DPETSC_USE_REAL_DOUBLE=1 -I$PETSC_DIR/include -I$PETSC_DIR/include/finclude -I$PETSC_DIR/$PETSC_ARCH/include" $PETSC_DIR/conf/variables
          echo "--- After conf/variables (FCPPFLAGS + include lines) ---"
          grep -n "FCPPFLAGS\|include.*petscvariables" $PETSC_DIR/conf/variables 2>&1 | head -10
          echo ""

          # 2. Patch petscvariables 本身 — 这才是真正的配置源！
          echo "--- Before petscvariables (FCPPFLAGS lines) ---"
          ls -la $PETSC_DIR/$PETSC_ARCH/conf/petscvariables 2>&1
          grep -n "FCPPFLAGS\|PETSC_FCPPFLAGS\|PETSC_FC_INCLUDES\|FPP_FLAGS" $PETSC_DIR/$PETSC_ARCH/conf/petscvariables 2>&1 | head -10
          cp $PETSC_DIR/$PETSC_ARCH/conf/petscvariables $PETSC_DIR/$PETSC_ARCH/conf/petscvariables.bak
          sed -i '/^[[:space:]]*FCPPFLAGS[[:space:]]*=/d' $PETSC_DIR/$PETSC_ARCH/conf/petscvariables
          sed -i '/^[[:space:]]*PETSC_FCPPFLAGS[[:space:]]*=/d' $PETSC_DIR/$PETSC_ARCH/conf/petscvariables
          sed -i '/^[[:space:]]*PETSC_FC_INCLUDES[[:space:]]*=/d' $PETSC_DIR/$PETSC_ARCH/conf/petscvariables
          echo "FCPPFLAGS = -DPETSC_USE_FORTRAN_DATATYPES=1 -DPETSC_USE_REAL_DOUBLE=1 -I$PETSC_DIR/include -I$PETSC_DIR/include/finclude -I$PETSC_DIR/$PETSC_ARCH/include" >> $PETSC_DIR/$PETSC_ARCH/conf/petscvariables
          echo "FC_FLAGS = -fallow-argument-mismatch -ffree-line-length-none -Wno-error -J$(pwd)/objs/$PETSC_ARCH -I$(pwd)/objs/$PETSC_ARCH -I$PETSC_DIR/$PETSC_ARCH/include" >> $PETSC_DIR/$PETSC_ARCH/conf/petscvariables
          echo "--- After petscvariables (FCPPFLAGS + FC_FLAGS) ---"
          grep -n "FCPPFLAGS\|FC_FLAGS\|FCFLAGS" $PETSC_DIR/$PETSC_ARCH/conf/petscvariables 2>&1 | head -10
          echo ""

          # 3. Patch conf/rules
          echo "--- Patching conf/rules ---"
          if [ -f "$PETSC_DIR/conf/rules" ]; then
            cp $PETSC_DIR/conf/rules $PETSC_DIR/conf/rules.bak
            sed -i 's/^PETSC_ARCH *= *.*/PETSC_ARCH = linux-gcc-openmpi-mef90-O/' $PETSC_DIR/conf/rules
            sed -i '/^[[:space:]]*FCPPFLAGS[[:space:]]*=/d' $PETSC_DIR/conf/rules
            sed -i '/^[[:space:]]*PETSC_FCPPFLAGS[[:space:]]*=/d' $PETSC_DIR/conf/rules
            echo "FCPPFLAGS = -DPETSC_USE_FORTRAN_DATATYPES=1 -DPETSC_USE_REAL_DOUBLE=1 -I$PETSC_DIR/include -I$PETSC_DIR/include/finclude -I$PETSC_DIR/$PETSC_ARCH/include" >> $PETSC_DIR/conf/rules
            grep -n "FCPPFLAGS" $PETSC_DIR/conf/rules | head -3
          fi
          echo "=============================================="

          echo ""
          echo "=== FORCE PETSc .mod INTO objs/ (ensure gfortran finds correct versions first) ==="
          cp -f $PETSC_DIR/$PETSC_ARCH/include/*.mod objs/${PETSC_ARCH}/
          echo "  Copied $(ls $PETSC_DIR/$PETSC_ARCH/include/*.mod | wc -l) PETSc .mod files into objs"
          echo "  petsctsdef.mod size: $(ls -la objs/${PETSC_ARCH}/petsctsdef.mod 2>&1)"
          echo "=== ENV ==="
          echo "FC_FLAGS=$FC_FLAGS"
          echo "FCFLAGS=$FCFLAGS"
          echo "FCPPFLAGS=$FCPPFLAGS"
          echo "PETSC_DIR=$PETSC_DIR"
          echo "PETSC_ARCH=$PETSC_ARCH"

          echo ""
          echo "========== TS MODULE DIAGNOSTIC TEST =========="
          set +e
          echo "--- 1. petsctsdef.mod exists? ---"
          ls -la $PETSC_DIR/$PETSC_ARCH/include/petsctsdef.mod 2>&1
          echo "--- 2. petscts.mod exists? ---"
          ls -la $PETSC_DIR/$PETSC_ARCH/include/petscts.mod 2>&1
          echo "--- 3. petsc.mod exists? ---"
          ls -la $PETSC_DIR/$PETSC_ARCH/include/petsc.mod 2>&1
          echo "--- 4. ALL .mod files in ARCH/include ---"
          ls $PETSC_DIR/$PETSC_ARCH/include/*.mod 2>&1 | wc -l
          ls $PETSC_DIR/$PETSC_ARCH/include/*.mod 2>&1
          echo "--- 5. Test A: gfortran direct Use petsctsdef ---"
          printf 'program test_ts\n  use petsctsdef, only: TS\n  implicit none\n  type(TS) :: ts\n  print *, "TS works!"\nend program\n' > /tmp/test_ts.f90
          cat /tmp/test_ts.f90
          /home/runner/openmpi-3.1.3/bin/mpif90 $FC_FLAGS -I$PETSC_DIR/$PETSC_ARCH/include -J/tmp /tmp/test_ts.f90 -o /tmp/test_ts 2>&1; echo "TEST_A_EXIT=$?"
          echo "--- 6. Test B: Use petsc transitively ---"
          printf 'program test_ts2\n  use petsc\n  implicit none\n  type(TS) :: ts\n  print *, "TS via petsc works!"\nend program\n' > /tmp/test_ts2.f90
          cat /tmp/test_ts2.f90
          /home/runner/openmpi-3.1.3/bin/mpif90 $FC_FLAGS -I$PETSC_DIR/$PETSC_ARCH/include -J/tmp /tmp/test_ts2.f90 -o /tmp/test_ts2 2>&1; echo "TEST_B_EXIT=$?"
          echo "--- 7. petscdef.h content around TS ---"
          grep -n "TS\|petscts\|FORTRAN_DATATYPES" $PETSC_DIR/include/finclude/petscdef.h 2>&1 | head -20
          echo "--- 8. conf/variables PETSC_ARCH line ---"
          grep -n "PETSC_ARCH" $PETSC_DIR/conf/variables 2>&1 | head -10
          echo "--- 9. petscconf.h FORTRAN_DATATYPES ---"
          grep -n "FORTRAN_DATATYPES\|FORTRAN_ADDR" $PETSC_DIR/include/petscconf.h 2>&1 | head -10
          grep -n "FORTRAN_DATATYPES\|FORTRAN_ADDR" $PETSC_DIR/$PETSC_ARCH/include/petscconf.h 2>&1 | head -10
          echo "--- 10. mpif90 -E preprocess FlowAssembly.F90, show TS context ---"
          echo "=== FLOWASSEMBLY FULL TS LINES (after preprocess) ==="
          /home/runner/openmpi-3.1.3/bin/mpif90 -E $FC_FLAGS $FCPPFLAGS -I${MEF90_DIR}/MEF90 -DMEF90_DIM=2 \
            ${MEF90_DIR}/m_Flow/m_MEF90_FlowAssembly.F90 2>&1 > /tmp/fa_pp.f90
          echo "Preprocessed FA file size: $(wc -l /tmp/fa_pp.f90)"
          echo "ALL lines containing 'TS' (case insensitive):"
          grep -in 'TS\b\|ts\b' /tmp/fa_pp.f90 | head -30
          echo ""
          echo "Lines 230-270 (TS callback region):"
          sed -n '230,270p' /tmp/fa_pp.f90
          echo "--- 11. mpif90 -E preprocess FlowCtx.F90, show TS context ---"
          echo "=== FLOWCTX FULL TS LINES (after preprocess) ==="
          /home/runner/openmpi-3.1.3/bin/mpif90 -E $FC_FLAGS $FCPPFLAGS -I${MEF90_DIR}/MEF90 \
            ${MEF90_DIR}/m_Flow/m_MEF90_FlowCtx.F90 2>&1 > /tmp/fc_pp.f90
          echo "Preprocessed FC file size: $(wc -l /tmp/fc_pp.f90)"
          echo "ALL lines containing 'TS' (case insensitive):"
          grep -in 'TS\b\|ts\b' /tmp/fc_pp.f90 | head -30
          echo ""
          echo "Lines 45-70 (TS member region):"
          sed -n '45,70p' /tmp/fc_pp.f90
          echo "=== STEP-14 ADDITIONAL: PP with ACTUAL make env ==="
          echo "=============================================="
          echo "=== 1. Get ACTUAL FCPPFLAGS from petscvariables (post-patch) ==="
          echo "petscvariables FCPPFLAGS line:"
          grep 'FCPPFLAGS' $PETSC_DIR/$PETSC_ARCH/conf/petscvariables | tail -1 || true
          echo "conf/rules FCPPFLAGS line:"
          grep 'FCPPFLAGS' $PETSC_DIR/conf/rules | tail -1 || true
          echo "conf/variables FCPPFLAGS line:"
          grep 'FCPPFLAGS' $PETSC_DIR/conf/variables | tail -1 || true
          echo ""
          echo "=== 2. Preprocess FlowAssembly WITH -DMEF90_DIM=2 (actual make arg) ==="
          echo "Command: mpif90 -E FC_FLAGS FCPPFLAGS -DMEF90_DIM=2 -I MEF90/MEF90 FlowAssembly.F90"
          /home/runner/openmpi-3.1.3/bin/mpif90 -E $FC_FLAGS $FCPPFLAGS -I${MEF90_DIR}/MEF90 -DMEF90_DIM=2 \
            ${MEF90_DIR}/m_Flow/m_MEF90_FlowAssembly.F90 > /tmp/fa2d_pp.f90 2>&1
          echo "--- GREP Type(TS) in preprocessed ---"
          grep -in 'Type\s*(\s*TS\s*)' /tmp/fa2d_pp.f90 | head -10 || true
          echo "--- GREP PetscFortranAddr in preprocessed ---"
          grep -in 'PetscFortranAddr' /tmp/fa2d_pp.f90 | head -10 || true
          echo "--- GREP ALL 'TS' lines around TS callbacks ---"
          sed -n '235,260p' /tmp/fa2d_pp.f90
          echo ""
          echo "=== 3. Preprocess FlowCtx WITHOUT -DMEF90_DIM (actual make arg) ==="
          /home/runner/openmpi-3.1.3/bin/mpif90 -E $FC_FLAGS $FCPPFLAGS -I${MEF90_DIR}/MEF90 \
            ${MEF90_DIR}/m_Flow/m_MEF90_FlowCtx.F90 > /tmp/fc_pp.f90 2>&1
          echo "--- GREP Type(TS) in preprocessed ---"
          grep -in 'Type\s*(\s*TS\s*)' /tmp/fc_pp.f90 | head -10 || true
          echo "--- GREP PetscFortranAddr in preprocessed ---"
          grep -in 'PetscFortranAddr' /tmp/fc_pp.f90 | head -10 || true
          echo "--- Show TS member region ---"
          sed -n '40,65p' /tmp/fc_pp.f90
          echo ""
          echo "=== 4. CRITICAL TEST: Preprocess FlowCtx WITH -DMEF90_DIM=2 ==="
          /home/runner/openmpi-3.1.3/bin/mpif90 -E $FC_FLAGS $FCPPFLAGS -I${MEF90_DIR}/MEF90 -DMEF90_DIM=2 \
            ${MEF90_DIR}/m_Flow/m_MEF90_FlowCtx.F90 > /tmp/fc_dim2_pp.f90 2>&1
          echo "--- GREP Type(TS) in preprocessed ---"
          grep -in 'Type\s*(\s*TS\s*)' /tmp/fc_dim2_pp.f90 | head -10 || true
          echo "--- Show TS member region ---"
          sed -n '40,65p' /tmp/fc_dim2_pp.f90
          echo "=== END STEP-14 ADDITIONAL ==="
          echo ""

          echo "=== 1) BUILD MEF90 (core) ==="
          cp -f $PETSC_DIR/$PETSC_ARCH/include/*.mod objs/${PETSC_ARCH}/
          make -C objs/${PETSC_ARCH} -f ../../MEF90/Makefile MEF90 \
            PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH MEF90_DIR=$MEF90_DIR \
            FC_FLAGS="$FC_FLAGS" FCPPFLAGS="$FCPPFLAGS" FFLAGS="" FPPFLAGS="" F90FLAGS="" FCFLAGS="" \
            2>&1 | tee /tmp/MEF90.log
          echo "  MEF90 count=$(ls objs/${PETSC_ARCH}/*.o 2>/dev/null | wc -l)"
          echo ""
          echo "=== MINI TEST A: Compile minimal 'Use m_MEF90 + Type(TS)' NO MEF90_DIM ==="
          printf '#include "finclude/petscdef.h"\nprogram mini_a\n  Use m_MEF90\n  implicit none\n  type(TS) :: tsObj\n  print *, "A-OK"\nend program\n' > /tmp/mini_a.f90
          echo "Source:"; cat /tmp/mini_a.f90
          /home/runner/openmpi-3.1.3/bin/mpif90 $FC_FLAGS $FCPPFLAGS -I${MEF90_DIR}/MEF90 -I$(pwd)/objs/${PETSC_ARCH} \
            /tmp/mini_a.f90 -o /tmp/mini_a 2>&1; echo "MINI_A_EXIT=$?"
          echo ""
          echo "=== MINI TEST B: Same + -DMEF90_DIM=2 ==="
          printf '#include "finclude/petscdef.h"\nprogram mini_b\n  Use m_MEF90\n  implicit none\n  type(TS) :: tsObj\n  print *, "B-OK"\nend program\n' > /tmp/mini_b.f90
          echo "Source:"; cat /tmp/mini_b.f90
          /home/runner/openmpi-3.1.3/bin/mpif90 $FC_FLAGS $FCPPFLAGS -I${MEF90_DIR}/MEF90 -I$(pwd)/objs/${PETSC_ARCH} -DMEF90_DIM=2 \
            /tmp/mini_b.f90 -o /tmp/mini_b 2>&1; echo "MINI_B_EXIT=$?"
          echo ""
          echo "=== MINI TEST C: FlowCtx body + -DMEF90_DIM=2 (no Private) ==="
          printf 'Module mini_c\n#include "finclude/petscdef.h"\n  Use m_MEF90\n  implicit none\n  type(TS) :: tsMember\nend Module\n' > /tmp/mini_c.f90
          echo "Source:"; cat /tmp/mini_c.f90
          /home/runner/openmpi-3.1.3/bin/mpif90 $FC_FLAGS $FCPPFLAGS -I${MEF90_DIR}/MEF90 -I$(pwd)/objs/${PETSC_ARCH} -DMEF90_DIM=2 \
            -c /tmp/mini_c.f90 -o /tmp/mini_c.o 2>&1; echo "MINI_C_EXIT=$?"
          echo ""
          echo "=== 2) BUILD m_DefMech ==="
          cp -f $PETSC_DIR/$PETSC_ARCH/include/*.mod objs/${PETSC_ARCH}/
          make -C objs/${PETSC_ARCH} -f ../../m_DefMech/Makefile m_DefMech PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH MEF90_DIR=$MEF90_DIR FC_FLAGS="$FC_FLAGS" FCPPFLAGS="$FCPPFLAGS" 2>&1 | tee /tmp/m_DefMech.log
          echo "  m_DefMech count=$(ls objs/${PETSC_ARCH}/*.o 2>/dev/null | wc -l)"
          echo "=== 3) BUILD m_HeatXfer ==="
          cp -f $PETSC_DIR/$PETSC_ARCH/include/*.mod objs/${PETSC_ARCH}/
          make -C objs/${PETSC_ARCH} -f ../../m_HeatXfer/Makefile m_HeatXfer PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH MEF90_DIR=$MEF90_DIR FC_FLAGS="$FC_FLAGS" FCPPFLAGS="$FCPPFLAGS" 2>&1 | tee /tmp/m_HeatXfer.log
          echo "=== 4) BUILD m_Flow ==="
          cp -f $PETSC_DIR/$PETSC_ARCH/include/*.mod objs/${PETSC_ARCH}/
          rm -f objs/${PETSC_ARCH}/m_MEF90_Flow*.o objs/${PETSC_ARCH}/m_mef90_flow*.mod
          make -C objs/${PETSC_ARCH} -f ../../m_Flow/Makefile m_Flow \
            PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH MEF90_DIR=$MEF90_DIR \
            FC_FLAGS="$FC_FLAGS" FCPPFLAGS="$FCPPFLAGS" FFLAGS="" FPPFLAGS="" F90FLAGS="" FCFLAGS="" \
            2>&1 | tee /tmp/flow.log || { echo "=== FLOW.LOG LAST 50 LINES ==="; tail -50 /tmp/flow.log; exit 1; }
          echo "=== m_Flow PIPESTATUS: ${PIPESTATUS[*]} ==="
          echo "--- flow.log last 100 lines ---"
          tail -100 /tmp/flow.log
          echo "--- objs/$PETSC_ARCH m_Flow files ---"
          ls -la objs/${PETSC_ARCH}/m_MEF90_Flow* objs/${PETSC_ARCH}/m_mef90_flow* 2>&1 || echo "(no m_Flow output files)"
          echo "--- total .o count: $(ls objs/${PETSC_ARCH}/*.o 2>/dev/null | wc -l) ---"
          echo "=== 5) BUILD vDef ==="
          if [ -f objs/${PETSC_ARCH}/m_MEF90_Flow.o ]; then
            make -C objs/${PETSC_ARCH} -f ../../vDef/Makefile vDef vDefP vDefUpa vDefBT vDefHF PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH MEF90_DIR=$MEF90_DIR FC_FLAGS="$FC_FLAGS" 2>&1 | tee /tmp/vDef.log || { echo "=== vDef build FAILED (tail of /tmp/vDef.log) ==="; tail -80 /tmp/vDef.log; exit 1; }
            ls -la bin/$PETSC_ARCH/vDef 2>&1 || echo "  (vDef not found)"
          else
            echo "  SKIPPED — m_MEF90_Flow.o missing"
            exit 1
          fi
          echo "=== HARD ASSERT: build artifacts (set +e above must not hide failures) ==="
          if [ ! -x bin/$PETSC_ARCH/vDef ]; then
            echo "=== FAIL: vDef executable missing or not executable after build ==="
            tail -80 /tmp/vDef.log
            exit 1
          fi
          file bin/$PETSC_ARCH/vDef
      - name: Run Terzaghi
        if: always()
        # CI #57 hung for 1h in mpirun (MPI deadlock) with no step timeout.
        # Cap the step and the solver so a hang always produces diagnostics.
        # Bumped 20->45 for CI #76, then 45->60 for CI #77: the AT2-damage
        # divergence plus the NODAMAGE (AT2Elastic) + ROBUSTKSP (strong-KSP)
        # diagnostic variants each can eat their full timeout when the
        # displacement SNES diverges. 60->75 for CI #83: one extra full
        # 51-step run (-disp_snes_type ksponly) supplies the physics verdict.
        timeout-minutes: 75
        run: |
          set +e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          export MEF90_DIR=$(pwd)
          # PETSc 3.3 is configured --with-shared-libraries=1; all -lmetis,
          # -lparmetis, -lHYPRE, -lexodus, -lhdf5 ... resolve from the arch lib
          # dir at link time, so the dynamic loader needs the same dir at run time.
          # NEVER add $HOME/miniconda2/lib here: its bundled libstdc++.so.6,
          # libgcc_s, libz and libtinfo predate the system gcc 13 runtime used
          # to build PETSc and cause "version GLIBCXX_3.4.32 not found".
          export LD_LIBRARY_PATH="$PETSC_DIR/$PETSC_ARCH/lib:$MPI_HOME/lib"
          # Defensive: --download-* packages sometimes leave .so files in
          # externalpackages subdirs. Append them LAST so any bundled copy of a
          # system runtime can never shadow /usr/lib/x86_64-linux-gnu.
          EXTRA_LIB_DIRS=$(find "$PETSC_DIR/$PETSC_ARCH" -name 'lib*.so*' -printf '%h\n' 2>/dev/null \
            | sort -u | grep -v -x "$PETSC_DIR/$PETSC_ARCH/lib" | tr '\n' ':' | sed 's/:$//')
          if [ -n "$EXTRA_LIB_DIRS" ]; then
            export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:$EXTRA_LIB_DIRS"
          fi
          cd vDef
          # CI #67: always start from a virgin result file. MEF90DefMechFormatEXO
          # (which writes the nodal variable NAMES) only runs when the output
          # file is unformatted (EXGVP returns 0), so a stale _out.gen would
          # silently keep the old "Temperature" label for the pressure field.
          rm -f data/Beam1x10-tri3_out.gen
          # Many data/*.gen entries in this repo are TEXT POINTERS: they were
          # symlinks to ../../TestMeshes/*.gen, materialized as plain text on
          # Windows checkouts. Exodus needs a real NetCDF/HDF5 file; magic must
          # be CDF\001 / CDF\002 / CDF\005 or the HDF5 signature.
          echo "=== validating vDef/data/*.gen meshes ==="
          for g in data/*.gen; do
            [ -f "$g" ] || continue
            magic=$(head -c 4 "$g" | od -An -tx1 | tr -d ' \n')
            case "$magic" in
              43444601|43444602|43444605|89484446) echo "  OK        $g ($magic)" ;;
              *) src="../TestMeshes/$(basename "$g")"
                 if [ -f "$src" ] && [ "$(head -c 3 "$src" | od -An -tx1 | tr -d ' \n')" = "434446" ]; then
                   cp -f "$src" "$g"
                   echo "  RESTORED  $g from $src"
                 else
                   echo "  FAIL: $g is a text pointer and $src is not a valid Exodus mesh"
                   exit 1
                 fi ;;
            esac
          done
          geom_magic=$(head -c 3 data/Beam1x10-tri3.gen | od -An -tx1 | tr -d ' \n')
          if [ "$geom_magic" != "434446" ]; then
            echo "=== FAIL: geometry data/Beam1x10-tri3.gen is not an Exodus/NetCDF file (magic=$geom_magic) ==="
            exit 1
          fi
          if [ ! -x ../bin/$PETSC_ARCH/vDef ]; then
            echo "=== FAIL: vDef executable not found; the build step did not produce a binary ==="
            exit 1
          fi
          echo "=== LD_LIBRARY_PATH ==="
          echo "$LD_LIBRARY_PATH"
          echo "=== ldd ../bin/$PETSC_ARCH/vDef ==="
          ldd ../bin/$PETSC_ARCH/vDef 2>&1 | tee /tmp/ldd-vDef.log
          if grep -Eq "=> not found|version .* not found|error while loading shared libraries" /tmp/ldd-vDef.log; then
            echo "=== FAIL: unresolved or ABI-incompatible shared libraries; check LD_LIBRARY_PATH above ==="
            grep -E "=> not found|version .* not found|error while loading shared libraries" /tmp/ldd-vDef.log
            exit 1
          fi
          echo "=== system runtime libraries resolved for vDef ==="
          grep -E "libstdc\+\+|libgcc_s|libz\.so|libtinfo" /tmp/ldd-vDef.log || true
          # CI #70: use the CreateTS default KSPCG (MEF90FlowCreateTS sets it).
          # CI #69 ran GMRES and CG back-to-back on the same binary/mesh/deck:
          # the pressure fields agree to 2.5e-5 Pa (2.5e-10 relative) and CG
          # needs 35% fewer linear iterations (1973 vs 3043). To re-run that
          # comparison use vDef/data/compare_ksp_runs.py, see the checklist.
          # Keep rtol/converged_reason identical to the #68/#69 baseline.
          #
          # CI #71: the DefMech displacement SNES reports reason -5
          # (SNES_DIVERGED_MAX_IT) on all 51 outer steps.  The deck is nearly
          # linear (alpha ~ 4e-5), so the L2 secant line search is replaced by
          # a full Newton step (basic); -disp_snes_monitor records the fnorm
          # trace for the diagnosis table at the end of this step.
          # CI #86: the CI #73 "V2" variant (FD Jacobian + GMRES, 1500 s cap,
          # ~14 min of every ~17 min job) is RETIRED. Its hypothesis was
          # settled by CI #82/#83: FD Jacobian still reports -5, the 51x -5
          # come from an irreducible residual plateau (2.08e4 -> ~9 on the
          # first Newton step, then 3-13 forever), and ksponly produces a
          # PHYSICALLY EQUIVALENT field in 6 s. Keeping V2 burned ~80% of
          # the job time without producing any verdict. The production run
          # below now starts immediately and owns data/*_out.gen.
          #
          # CI #84 (option A): CI #83 proved the standard Newton run and the
          # ksponly run produce PHYSICALLY EQUIVALENT fields (dPressure=0,
          # dDamage=0.38%, dUx=0.21%, stress<=0.41%) while Newton burned 51
          # iterations per step on an irreducible residual plateau 3-13 and
          # reported 57x -5. The displacement system is effectively LINEAR for
          # this deck (SplitNone, damage~3.7e-5, zero damping/cohesion), so
          # one linear solve is the exact solve. Keep the monitor/reason flags
          # for diagnostics; they are harmless under SNESKSPONLY.
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason \
            -disp_snes_monitor -disp_snes_linesearch_type basic \
            -disp_snes_type ksponly -disp_snes_converged_reason \
            2>&1 | tee /tmp/terzaghi.log
          rc=${PIPESTATUS[0]}
          echo "=== Terzaghi mpirun exit code: $rc ==="
          # CI #83: freeze the PRODUCTION result mesh NOW. Every diagnostic
          # variant below (NODAMAGE / ROBUSTKSP / ksponly-physics) rewrites the
          # same data/Beam1x10-tri3_out.gen path; without this copy the physics
          # verdict would silently compare two diagnostic meshes instead of
          # the production run against ksponly.
          if [ -s data/Beam1x10-tri3_out.gen ]; then
            cp -f data/Beam1x10-tri3_out.gen /tmp/out_main.gen
            echo "=== saved production result mesh -> /tmp/out_main.gen ==="
          else
            echo "=== WARN: production result mesh missing; MAIN verdict INCONCLUSIVE ==="
          fi
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "=== FAIL: Terzaghi TIMED OUT / HUNG (MPI deadlock or stalled TS solve) ==="
            echo "=== last Gate 3.1 trace reached (both ranks print via PETSC_COMM_SELF) ==="
            grep -n "Gate 3.1" /tmp/terzaghi.log | tail -100 || true
            echo "=== last 80 raw lines before timeout ==="
            tail -80 /tmp/terzaghi.log
            exit 1
          fi
          echo "=== terzaghi.log (last 120 lines) ==="
          tail -120 /tmp/terzaghi.log
          # --------------------------------------------------------------------
          # CI #76 DIAGNOSTIC: isolate the AT2 damage *evolution*.
          # terzaghi1D_nodamage.yaml == terzaghi1D.yaml with damage.type AT2 -> AT2Elastic.
          # AT2Elastic sets isElastic (no damage-field growth) and Stiffness=1 (no
          # stiffness degradation): an INERT damage field. Runs BEFORE Gate 3.3 so
          # its log is captured even when the AT2 (active-damage) run above diverges.
          # If NODAMAGE converges while AT2 diverges, the poroelastic core is sound
          # and the AT2 damage SNES is the culprit.
          # --------------------------------------------------------------------
          echo "=== NODAMAGE (AT2Elastic, inert damage) diagnostic run ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D_nodamage.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason \
            -disp_snes_monitor -disp_snes_linesearch_type basic \
            2>&1 | tee /tmp/terzaghi_nodamage.log
          nd_rc=${PIPESTATUS[0]}
          echo "=== NODAMAGE mpirun exit code: $nd_rc ==="
          echo "=== NODAMAGE: displacement/damage SNES convergence reasons ==="
          grep -o "SNESConvergedReason -[0-9]*" /tmp/terzaghi_nodamage.log | sort | uniq -c || true
          nd_fail=$(grep -c "SNESSolve failed with SNESConvergedReason" /tmp/terzaghi_nodamage.log || true)
          echo "=== NODAMAGE non-convergent DefMech SNES solves: $nd_fail ==="
          if [ "$nd_fail" -gt 0 ]; then
            echo "=== NODAMAGE STILL DIVERGENT: poroelastic core itself is broken (deeper issue) ==="
          else
            echo "=== NODAMAGE CONVERGED: poroelastic core sound; AT2 damage evolution is the culprit ==="
          fi
          # --------------------------------------------------------------------
          # CI #81 KSPINIT diagnostic (variant name ROBUSTKSP kept for script
          # continuity). CI #80 proved verbose: 1 bypasses the SNESView SEGV:
          # ML really ran (rc=0, no crash, 2583 linear solves all converged,
          # 51 steps completed) yet the displacement SNES still diverged 51/51
          # at -5, with fnorm stuck oscillating in 0.03..16 (never < 1e-2).
          # => the weak-KSP/PC hypothesis is RULED OUT.
          #
          # New root-cause suspect, from m_MEF90_DefMech.F90:1476:
          #   Call KSPSetInitialGuessNonzero(kspDisp, PETSC_TRUE, ...)
          # CI #80 KSP iteration histogram: 1221 solves with 0 iterations,
          # 1163 with 1 iteration, and only ~51 with 39-44 iterations (one
          # real solve per outer step). After the first Newton solve, KSP
          # keeps reusing the previous increment as its initial guess, reports
          # CONVERGED_ATOL immediately, and SNES applies the SAME step again
          # -> oscillation -> MAX_IT. Log confirms "using nonzero initial guess".
          #
          # This variant restores the DEFAULT KSP (CG + bjacobi/ILU) and adds
          #   -disp_ksp_initial_guess_nonzero 0
          # KSPSetFromOptions (line 1481) runs AFTER KSPSetInitialGuessNonzero,
          # so the command-line option overrides the Fortran setting with NO
          # Fortran edit. Deck is terzaghi1D_robustksp.yaml (NODAMAGE + verbose 1).
          #   - CONVERGES -> fix = this one option on the production deck
          #     (zero Fortran, satisfies the zero-local-compile constraint).
          #   - Still -5 -> initial-guess hypothesis ruled out; check assembly.
          # --------------------------------------------------------------------
          echo "=== ROBUSTKSP/KSPINIT (verbose 1 + AT2Elastic + zero KSP initial guess) diagnostic run ==="
          timeout -k 10s 900 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D_robustksp.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason \
            -disp_snes_monitor -disp_snes_linesearch_type basic \
            -disp_ksp_initial_guess_nonzero 0 -disp_ksp_converged_reason \
            2>&1 | tee /tmp/terzaghi_robustksp.log
          rk_rc=${PIPESTATUS[0]}
          echo "=== ROBUSTKSP mpirun exit code: $rk_rc ==="
          # A verdict of CONVERGED requires ALL of: clean exit (rc=0), no crash
          # marker, zero non-convergent SNES reports, and >=1 real linear solve.
          # CI #78 proved a crash emits NO "SNESSolve failed" line and was
          # therefore mis-reported as convergence; CI #79 added crash detection;
          # CI #80 also guards against timeout (rc=124) and "no solve at all".
          rk_crash=$(grep -ciE "Caught signal|SEGV|MPI_ABORT|PETSC ERROR" /tmp/terzaghi_robustksp.log || true)
          rk_fail=$(grep -c "SNESSolve failed with SNESConvergedReason" /tmp/terzaghi_robustksp.log || true)
          rk_solves=$(grep -c "Linear solve" /tmp/terzaghi_robustksp.log || true)
          rk_laststep=$(grep -oE "Gate 3.1: step +[0-9]+" /tmp/terzaghi_robustksp.log | tail -1 | grep -oE "[0-9]+$" || echo 0)
          echo "=== ROBUSTKSP: rc=$rk_rc crash=$rk_crash nonconvergent=$rk_fail linear-solves=$rk_solves last-step=$rk_laststep ==="
          echo "=== ROBUSTKSP: displacement/damage SNES convergence reasons ==="
          grep -o "SNESConvergedReason -[0-9]*" /tmp/terzaghi_robustksp.log | sort | uniq -c || true
          echo "=== ROBUSTKSP non-convergent DefMech SNES solves: $rk_fail ==="
          echo "=== ROBUSTKSP: KSP linear-solve outcomes (verbose 1 => no SNESView attribution) ==="
          grep -oE "Linear solve [a-zA-Z ]+" /tmp/terzaghi_robustksp.log | sort | uniq -c | head || true
          echo "=== ROBUSTKSP: last Gate 3.1 pressure stats ==="
          grep -E "pmin|pmax" /tmp/terzaghi_robustksp.log | tail -3 || true
          echo "=== ROBUSTKSP: displacement KSP linear-solve outcomes (attributed to Disp_) ==="
          awk '/SNES Object: \(Disp_\)/{s=1} /SNES Object: \((flow_|damage_)\)/{s=0} s&&/Linear solve/{c[$0]++} END{for(k in c) print c[k], k}' /tmp/terzaghi_robustksp.log | sort -rn || true
          if [ "$rk_crash" -gt 0 ]; then
            echo "=== ROBUSTKSP CRASHED (SEGV/MPI_ABORT): no convergence verdict ==="
          elif [ "$rk_rc" -ne 0 ]; then
            echo "=== ROBUSTKSP INCOMPLETE (mpirun rc=$rk_rc: timeout/abort): no convergence verdict ==="
          elif [ "$rk_solves" -eq 0 ]; then
            echo "=== ROBUSTKSP INCONCLUSIVE: no linear solve was recorded ==="
          elif [ "$rk_fail" -gt 0 ]; then
            echo "=== KSPINIT STILL DIVERGENT: nonzero-initial-guess hypothesis NOT confirmed; check assembly ==="
          else
            echo "=== KSPINIT: 0 failure messages here is a FALSE CONVERGENCE (CI #81 / CI #83) ==="
            echo "    Only ~3 SNES iterations per step and the residual still sits at 7-9,"
            echo "    the same plateau as the diverging run. This is SNES_CONVERGED_SNORM_RELATIVE"
            echo "    with a zero step. -disp_ksp_initial_guess_nonzero 0 is NOT a fix; do not promote it."
            echo "    No conclusion may be drawn from failure-message counts; use the physics verdict below."
          fi
          # --------------------------------------------------------------------
          # CI #83 answered the question: the standard-Newton production field
          # and the ksponly field are PHYSICALLY EQUIVALENT (dPressure=0,
          # dDamage=0.38%, dUx=0.21%, stress<=0.41%). The 57x -5 therefore
          # does NOT corrupt the field; the residual plateau 3-13 is a
          # convergence-criterion / assembly-scale issue, not a wrong solve.
          # CI #84 (option A) makes ksponly the production solver, so this
          # second run is now a SAME-SOURCE DETERMINISM CHECK: two independent
          # 51-step runs must reproduce the same field (P7). Five earlier
          # "convergences" were false (#73 placeholders, #75 log-range, #78
          # SEGV, #81 zero step, #83 KSPINIT), so the verdict is always the
          # physical field in the Exodus mesh, never a solver message / fnorm
          # / reason code / failure count.
          # Criteria P1-P8 live in data/check_terzaghi_displacement.py and
          # FLOW_FIX_CHECKLIST.md. This MUST run BEFORE Gate 3.3: its exit 1
          # skips everything after it (CI #82 lost snes_l2/ksponly that way).
          # --------------------------------------------------------------------
          echo "=== KSPONLY-PHYS same-source determinism run (-disp_snes_type ksponly) ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason \
            -disp_snes_type ksponly -disp_snes_converged_reason \
            2>&1 | tee /tmp/terzaghi_ksponly_phys.log
          ko_rc=${PIPESTATUS[0]}
          echo "=== KSPONLY-PHYS mpirun exit code: $ko_rc ==="
          ko_crash=$(grep -ciE "Caught signal|SEGV|MPI_ABORT|PETSC ERROR" /tmp/terzaghi_ksponly_phys.log || true)
          ko_msg=$(grep -c "SNESSolve failed with SNESConvergedReason" /tmp/terzaghi_ksponly_phys.log || true)
          ko_steps=$(grep -c "Gate 3.1: step" /tmp/terzaghi_ksponly_phys.log || true)
          echo "=== KSPONLY-PHYS: rc=$ko_rc crash=$ko_crash failure-msgs=$ko_msg step-lines=$ko_steps ==="
          echo "=== KSPONLY-PHYS: final Gate 3.2 pressure envelope ==="
          grep "Gate 3.2:" /tmp/terzaghi_ksponly_phys.log | tail -2 || true
          if [ -s data/Beam1x10-tri3_out.gen ]; then
            cp -f data/Beam1x10-tri3_out.gen /tmp/out_ksponly.gen
            echo "=== saved ksponly result mesh -> /tmp/out_ksponly.gen ==="
          else
            echo "=== WARN: ksponly produced no result mesh; verdict INCONCLUSIVE ==="
          fi
          # --------------------------------------------------------------------
          # Gate 4.1 NOBIOT control (CI #85).
          # Same binary / mesh / options as the production run, but the deck
          # is terzaghi1D_nobiot.yaml: byte-identical to terzaghi1D.yaml
          # except biot_coeff 1.0 -> 0.0. With alpha=0 AND no preset body
          # force (CI #85) the displacement field is EXACTLY zero over all
          # 51 records, giving an INDEPENDENT physical check that the
          # -alpha*grad(p) term is live (criterion B6 of check_gate41_biot.py,
          # which handles the zero control field explicitly instead of
          # computing a pm/0 -> inf ratio). A command-line
          # -flow_biot_coeff override is deliberately NOT used: PETSc 3.3 bag
          # options can be rejected as "Unknown option", which would silently
          # produce no control mesh. Deck variants are the proven pattern here
          # (terzaghi1D_nodamage.yaml / terzaghi1D_robustksp.yaml).
          # Must run BEFORE the production mesh is restored: every variant
          # writes the same data/Beam1x10-tri3_out.gen path.
          # --------------------------------------------------------------------
          echo "=== Gate 4.1 NOBIOT control run (biot_coeff=0, ksponly) ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D_nobiot.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason \
            -disp_snes_type ksponly -disp_snes_converged_reason \
            2>&1 | tee /tmp/terzaghi_nobiot.log
          nb_rc=${PIPESTATUS[0]}
          echo "=== Gate 4.1 NOBIOT mpirun exit code: $nb_rc ==="
          if [ -s data/Beam1x10-tri3_out.gen ]; then
            cp -f data/Beam1x10-tri3_out.gen /tmp/out_nobiot.gen
            echo "=== saved NOBIOT result mesh -> /tmp/out_nobiot.gen ==="
          else
            echo "=== WARN: NOBIOT produced no result mesh; Gate 4.1 B6 must FAIL ==="
          fi
          # --------------------------------------------------------------------
          # Gate 4.1 BODYFORCE diagnostic (CI #86, option B).
          # CI #85 proved the production deck has NO non-zero preset body
          # force: "Force: 0, -9.81, 0" has spaces after commas, so PETSc
          # 3.3's RealArray reader keeps only the first element and the bag
          # view reads "Force = 0 0 0". With force_scaling=linear that gives
          # |baseForce| == 0 forever: B3 (Linear scaling not rolled back)
          # fails, and B4 (superposition vs overwrite) has NO discriminating
          # power because base==0 makes both implementations identical.
          # terzaghi1D_bodyforce.yaml differs ONLY by cs0001.Force
          # 0,0,0 -> 0,-9.81,0 (no spaces), so |baseForce| grows 0 -> 9.81.
          # This is DIAGNOSTIC ONLY: the production mesh is already frozen in
          # /tmp/out_main.gen and is restored below for Gates 3.1/3.2/3.3,
          # so introducing a body force can never perturb the green gate.
          # --------------------------------------------------------------------
          echo "=== Gate 4.1 BODYFORCE diagnostic run (Force=0,-9.81,0, ksponly) ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D_bodyforce.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason \
            -disp_snes_type ksponly -disp_snes_converged_reason \
            2>&1 | tee /tmp/terzaghi_bodyforce.log
          bf_rc=${PIPESTATUS[0]}
          echo "=== Gate 4.1 BODYFORCE mpirun exit code: $bf_rc ==="
          echo "=== Gate 4.1 BODYFORCE CellSet Force as parsed by PetscBag ==="
          grep -aE "^[[:space:]]*Force = " /tmp/terzaghi_bodyforce.log | sort -u | head -5 || true
          if [ -s data/Beam1x10-tri3_out.gen ]; then
            cp -f data/Beam1x10-tri3_out.gen /tmp/out_bodyforce.gen
            echo "=== saved BODYFORCE result mesh -> /tmp/out_bodyforce.gen ==="
          else
            echo "=== WARN: BODYFORCE produced no result mesh; Gate 4.1 B3/B4 must FAIL ==="
          fi
          # --------------------------------------------------------------------
          # Gate 4.2 (CI #87): feed the CELL-WISE FlowCtx%cellDarcyVelocity
          # into HeatXfer. The two decks are byte-identical except for
          # flow.enable_advection (true/false), and both enable a LIVE
          # steady heat field (heatxfer null->steadystate, T=0 at cs0010,
          # T=100*t at cs0020). Any temperature difference between the two
          # result meshes can therefore ONLY come from v_darcy.grad(T).
          # DIAGNOSTIC ONLY: the production mesh is already frozen in
          # /tmp/out_main.gen and restored below, so Gates 3.1/3.2/3.3 and
          # the delivered artifact are completely isolated.
          # --------------------------------------------------------------------
          for g42tag in advection noadvection; do
            echo "=== Gate 4.2 $g42tag diagnostic run (heatxfer steadystate, ksponly) ==="
            timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
              -prefix data/Beam1x10-tri3 \
              -options_file_yaml "data/terzaghi1D_${g42tag}.yaml" \
              -flow_ts_view -flow_ts_monitor \
              -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason \
              -disp_snes_type ksponly -disp_snes_converged_reason \
              2>&1 | tee "/tmp/terzaghi_${g42tag}.log"
            g42rc=${PIPESTATUS[0]}
            echo "=== Gate 4.2 $g42tag mpirun exit code: $g42rc ==="
            echo "=== Gate 4.2 $g42tag: thermal/advection bag values as parsed ==="
            grep -aiE "enable_advection|heatxfer_timeStepping_type|TempBC|boundaryTemp =|LinearThermalExpansion|ThermalConductivity" \
              "/tmp/terzaghi_${g42tag}.log" | sort -u | head -16 || true
            echo "=== Gate 4.2 $g42tag Gate 4.2 rows: $(grep -ac 'Gate 4.2: enabled=' "/tmp/terzaghi_${g42tag}.log" || true) ==="
            if [ -s data/Beam1x10-tri3_out.gen ]; then
              cp -f data/Beam1x10-tri3_out.gen "/tmp/out_${g42tag}.gen"
              echo "=== saved $g42tag result mesh -> /tmp/out_${g42tag}.gen ==="
            else
              echo "=== WARN: $g42tag produced no result mesh; Gate 4.2 D4-D8 must FAIL ==="
            fi
          done
          # --------------------------------------------------------------------
          # Gate 4.1b (effective-stress / total-stress Biot form).
          # terzaghi1D_stress.yaml is byte-identical to terzaghi1D.yaml except
          # flow.biot_effective_stress: true. With full Dirichlet BC on BOTH
          # ends (cs0010 & cs0020 displacementBC 1,1,1) the effective-stress
          # volume term -int(alpha*p*div v) is algebraically identical to the
          # body-force -int(alpha*grad p).v, so the displacement field must
          # match the production (superposition) run to KSP tolerance. The
          # Fortran returns early in this branch and writes "Gate 4.1b:
          # form=stress" instead of the body-force "Gate 4.1:" row, which is
          # exactly the mutual-exclusion signal the verdict checks (E4).
          # DIAGNOSTIC ONLY: the production mesh is already frozen in
          # /tmp/out_main.gen and is restored below, so the delivered artifact
          # and Gates 3.1/3.2/3.3 stay the main run.
          # --------------------------------------------------------------------
          echo "=== Gate 4.1b effective-stress diagnostic run (biot_effective_stress=true, ksponly) ==="
          timeout -k 10s 600 mpirun --allow-run-as-root -np 2 -x LD_LIBRARY_PATH ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D_stress.yaml \
            -flow_ts_view -flow_ts_monitor \
            -flow_ksp_rtol 1.0e-10 -flow_ksp_converged_reason \
            -disp_snes_type ksponly -disp_snes_converged_reason \
            2>&1 | tee /tmp/terzaghi_stress.log
          s41b_rc=${PIPESTATUS[0]}
          echo "=== Gate 4.1b effective-stress mpirun exit code: $s41b_rc ==="
          echo "=== Gate 4.1b: effective-stress diagnostic rows: $(grep -ac 'Gate 4.1b: form=stress' /tmp/terzaghi_stress.log || true); body-force rows (want 0): $(grep -ac 'Gate 4.1:' /tmp/terzaghi_stress.log || true) ==="
          if [ -s data/Beam1x10-tri3_out.gen ]; then
            cp -f data/Beam1x10-tri3_out.gen /tmp/out_stress.gen
            echo "=== saved effective-stress result mesh -> /tmp/out_stress.gen ==="
          else
            echo "=== WARN: effective-stress produced no result mesh; Gate 4.1b E2 must FAIL ==="
          fi
          # Restore the PRODUCTION mesh so Gates 3.1/3.2 and the delivered
          # artifact stay the main-run output (diagnostic variants overwrite it).
          if [ -s /tmp/out_main.gen ]; then
            cp -f /tmp/out_main.gen data/Beam1x10-tri3_out.gen
            echo "=== restored production result mesh for Gates 3.1/3.2 ==="
          fi
          echo "=== PHYSICS VERDICT P1-P8 (report mode; Gate 3.3 uses --gate separately) ==="
          python3 data/check_terzaghi_displacement.py \
            /tmp/out_main.gen /tmp/out_ksponly.gen /tmp/terzaghi_ksponly_phys.log \
            2>&1 | tee /tmp/terzaghi_verdict.log || true
          echo "=== result files (3.2 analytical-comparison data source) ==="
          echo "    -prefix data/Beam1x10-tri3 -> geometry data/Beam1x10-tri3.gen, result data/Beam1x10-tri3_out.gen"
          ls -la data/Beam1x10-tri3_out.gen 2>/dev/null || echo "(no _out.gen result file)"
          find . -maxdepth 2 \( -name '*_out.gen' -o -name '*.exo' \) -printf '%p %s bytes\n' 2>/dev/null | head -20
          if grep -q "Unknown option" /tmp/terzaghi.log; then
            echo "=== FAIL: PetscBag enum value not in the registered list ==="
            grep -n "Unknown option" /tmp/terzaghi.log | head -4
            exit 1
          fi
          if grep -q "Error opening EXO file\|Could not recognize.*valid Exodus" /tmp/terzaghi.log; then
            echo "=== FAIL: Exodus geometry could not be opened ==="
            grep -n "Exodus Library\|Error opening EXO\|Magic value" /tmp/terzaghi.log | head -10
            exit 1
          fi
          if grep -q "Caught signal number 11 SEGV" /tmp/terzaghi.log; then
            echo "=== FAIL: segfault in vDef (initialization or solve) ==="
            echo "=== last 40 lines before the crash (CI #53 pinpoint) ==="
            crashline=$(grep -n -m1 "Caught signal number 11" /tmp/terzaghi.log | cut -d: -f1)
            if [ -n "$crashline" ]; then
              start=$((crashline > 40 ? crashline - 40 : 1))
              sed -n "${start},${crashline}p" /tmp/terzaghi.log
            fi
            echo "=== last Gate 3.1 trace reached (pinpoints the failing call) ==="
            grep -n "Gate 3.1" /tmp/terzaghi.log | tail -100 || true
            grep -n "Caught signal number 11" /tmp/terzaghi.log | head -4
            exit 1
          fi
          if grep -q "error while loading shared libraries" /tmp/terzaghi.log; then
            echo "=== FAIL: shared library could not be loaded at runtime ==="
            grep -n "error while loading shared libraries" /tmp/terzaghi.log | head -10
            exit 1
          fi
          # --- Gate 4.1 (hard): Biot body-force superposition -----------------
          # Checklist 4.1a: "开启体力缩放后结果不回滚". MEF90DefMechSetTransients
          # re-applies ForceScaling (default Linear) on EVERY outer step.
          # CI #86: the PRODUCTION deck is body-force free (|base| == 0), so
          # B3/B4 are judged on the BODYFORCE diagnostic log, where
          # |baseForce| grows 0 -> 9.81 and the superposition error can
          # actually distinguish "base - alpha*grad(p)" from an overwrite.
          # B1/B2/B5/B7 cover both logs; B6 uses the NOBIOT control mesh.
          # The Fortran side emits one "Gate 4.1:" diagnostic row per step.
          # Emit the verdict here but DEFER its exit 1 until after Gate 3.3,
          # so a Gate 4.1 failure never hides the Gate 3.3 physics table
          # (CI #82 lesson: an early exit 1 skips later diagnostics).
          python3 data/check_gate41_biot.py --gate \
            /tmp/terzaghi.log /tmp/out_main.gen /tmp/out_nobiot.gen \
            /tmp/terzaghi_bodyforce.log \
            2>&1 | tee /tmp/gate41_verdict.log
          g41_rc=${PIPESTATUS[0]}
          # --- Gate 4.2 (hard): does cell-wise v_darcy reach the heat field? -
          # Checklist 4.2: "开启 enable_advection 后热场受 v_darcy 平流影响".
          # Two identical decks (only flow.enable_advection differs) produce
          # two meshes; check_gate42_advection.py LOCKS the temperature slot
          # from the solver's temp_Offset bag value (CI #90: auto-discovery
          # picked a diverging Displacement_Y field) and requires a
          # NON-UNIFORM, growing, relative temperature difference plus D8
          # (mechanical fields stay at production magnitude). Solver
          # messages / fnorm / reason codes
          # are never trusted. Verdict printed here, exit 1 DEFERRED until
          # after Gate 3.3 (CI #82 lesson).
          python3 data/check_gate42_advection.py --gate \
            /tmp/terzaghi_advection.log /tmp/terzaghi_noadvection.log \
            /tmp/out_advection.gen /tmp/out_noadvection.gen /tmp/out_main.gen \
            2>&1 | tee /tmp/gate42_verdict.log
          g42_rc=${PIPESTATUS[0]}
          # --- Gate 3.3 (hard): PHYSICS VERDICT on the production field -----
          # CI #83 proved the old criterion -- counting "SNESSolve failed"
          # lines -- is WRONG (FLOW_FIX_CHECKLIST.md, section "CI #83 结果"):
          #   * the 19.5-min standard-Newton run and the 8-s ksponly run give
          #     equivalent physical fields (dPressure=0, dDamage=0.38%,
          #     dUx=0.21%, stress<=0.41%), so -5 did NOT corrupt the field;
          #   * Newton's residual drops 2.08e4 -> ~9 on the FIRST iteration
          #     and then oscillates on an irreducible plateau 3-13 for 50
          #     more iterations. Under -disp_snes_type ksponly that plateau is
          #     irrelevant: one linear solve is the exact solve for this
          #     effectively-linear deck (SplitNone, damage~3.7e-5, zero
          #     damping / cohesion).
          # Message counting also produced FIVE false convergences (#73, #75,
          # #78, #81, #83 KSPINIT). Gate 3.3 now calls the committed physics
          # checker in --gate mode: P1-P6 and P8 on /tmp/out_main.gen (the
          # mesh frozen immediately after the production run), plus >=50
          # records, t_end~1.0, finite fields, no crash markers / unknown
          # options and >=50 Gate 3.2 probes. ANY missing / unreadable data
          # is FAIL (CI #73 lesson), and the checker exits 1 on rejection.
          # damage SNES -5 messages are REPORTED, not counted: P8 verifies the
          # damage field itself stays finite, in [0,1] and bounded.
          defmech_fail=$(grep -cF "SNESSolve failed with SNESConvergedReason" /tmp/terzaghi.log || true)
          disp_fail=$(grep -cF "[ERROR]: displacement SNESSolve failed" /tmp/terzaghi.log || true)
          damage_fail=$(grep -cF "[ERROR]: damage field SNESSolve failed" /tmp/terzaghi.log || true)
          echo "=== Gate 3.3 diagnostics: displacement-msgs=$disp_fail damage-msgs=$damage_fail total=$defmech_fail (INFORMATIONAL ONLY) ==="
          grep -o "SNESConvergedReason -[0-9]*" /tmp/terzaghi.log | sort | uniq -c || true
          python3 data/check_terzaghi_displacement.py --gate \
            /tmp/out_main.gen /tmp/terzaghi.log \
            2>&1 | tee /tmp/gate33_verdict.log
          g33_rc=${PIPESTATUS[0]}
          if [ "$g33_rc" -ne 0 ]; then
            echo "=== FAIL: Gate 3.3 physics verdict rejected the production displacement field (rc=$g33_rc) ==="
            echo "    Check /tmp/gate33_verdict.log: P1 BC, P2 drift, P3 time drift,"
            echo "    P4/P5 u_x analytic peak, P6 pressure, P8 damage bounds."
            exit 1
          fi
          echo "=== Gate 3.3 PASS: P1-P6 + P8 physics criteria satisfied on /tmp/out_main.gen ==="
          # --- Gate 4.3 (hard): Flow option bags visible AND the CST BC stays
          # constant ------------------------------------------------------
          # Checklist 4.3's original premise ("a constant BC is multiplied by
          # time") was disproved by CI #92: bc_pressure_scaling already has
          # constant/linear/file modes, defaults to CST, and all decks declare
          # `constant`. The REAL gap was observability: FlowCtxSetFromOptions
          # registered three bags but never called PetscBagView, so no CI log
          # could prove which Flow options were actually parsed -- the same
          # silent-ignore bug class as 4.1a's `Force: 0, -9.81, 0` and CI #52.
          # CI #93 added three verbose-guarded PetscBagView calls (print only,
          # zero physics change); this checker reads that REAL bag format.
          # C1/C2 23 Global keys + 3 CellSet bags in each of 6 runs; C3 CST
          # semantics explicitly declared in every deck; C4 full deck<->bag
          # value agreement (116 comparisons); C5 variant signals still
          # discriminate; C6 drained BC pressure span=0 across 51 records,
          # closed end still decays (guards an all-zero fake field) plus Gate
          # 3.3 analytic L2; C7 Gate 4.1/4.2 regression, no fatal, wired.
          # Must run AFTER Gate 3.3 (needs gate33_verdict.log); its exit 1 is
          # DEFERRED until after 4.1/4.2 (CI #82 early-exit lesson).
          python3 data/check_gate43_flowbag.py --gate \
            /tmp data /tmp/out_main.gen \
            2>&1 | tee /tmp/gate43_verdict.log
          g43_rc=${PIPESTATUS[0]}
          # --- Gate 4.1b (hard): effective-stress Biot form equivalence ------
          # Checklist 4.1b: "含孔压时应力场体现有效应力修正" implemented as a mode
          # MUTUALLY EXCLUSIVE with the 4.1a body-force superposition. The stress
          # deck must emit "Gate 4.1b: form=stress" (E1); its displacement field
          # must match the superposition production run to relative L2 <= 1e-3 (E2);
          # the default production run must NOT emit the stress diagnostic (E3);
          # and the two forms must be mutually exclusive (E4). Verdict printed
          # here; exit 1 DEFERRED until after the other gates (CI #82 lesson), so
          # a 4.1b failure never hides the 4.1/4.2/4.3 physics tables.
          python3 data/check_gate41b.py --gate \
            /tmp/terzaghi_stress.log /tmp/terzaghi.log \
            /tmp/out_stress.gen /tmp/out_main.gen \
            2>&1 | tee /tmp/gate41b_verdict.log
          g41b_rc=${PIPESTATUS[0]}
          # Gate 4.1 deferred verdict (see the deferred-exit note above).
          if [ "$g41_rc" -ne 0 ]; then
            echo "=== FAIL: Gate 4.1 rejected the Biot superposition (rc=$g41_rc) ==="
            echo "    Check /tmp/gate41_verdict.log: B1 both logs, B2 alpha,"
            echo "    B3/B4 from BODYFORCE log (Linear scaling + true"
            echo "    superposition with non-zero |base|), B5 gradp,"
            echo "    B6 NOBIOT control, B7 both runs complete."
            exit 1
          fi
          echo "=== Gate 4.1 PASS: Linear force scaling preserved on non-zero baseForce, superposition error ~0 ==="
          # Gate 4.2 deferred verdict (see the deferred-exit note above).
          if [ "$g42_rc" -ne 0 ]; then
            echo "=== FAIL: Gate 4.2 rejected the Darcy-driven thermal advection (rc=$g42_rc) ==="
            echo "    Check /tmp/gate42_verdict.log: D1 both runs complete,"
            echo "    D2 enable flag differs, D3 velocity alive/decaying/same,"
            echo "    D4 mesh integrity, D5 live thermal field on temp_Offset slot,"
            echo "    D6 non-uniform growing response, D7 production isolation,"
            echo "    D8 mechanical fields at production magnitude (no blow-up)."
            exit 1
          fi
          echo "=== Gate 4.2 PASS: cell-wise v_darcy measurably changes the thermal field ==="
          # Gate 4.3 deferred verdict (see the deferred-exit note above).
          if [ "$g43_rc" -ne 0 ]; then
            echo "=== FAIL: Gate 4.3 rejected the Flow option bags / constant BC (rc=$g43_rc) ==="
            echo "    Check /tmp/gate43_verdict.log: C1 Global bag keys,"
            echo "    C2 CellSet bags, C3 CST scaling declared, C4 deck<->bag"
            echo "    agreement, C5 variant signals, C6 BC span/decay + L2,"
            echo "    C7 Gate 4.1/4.2 regression, fatal scan, coupling wire."
            exit 1
          fi
          echo "=== Gate 4.3 PASS: Flow bags visible, every deck option parsed, constant BC holds over 51 steps ==="
          # Gate 4.1b deferred verdict (see the deferred-exit note above).
          if [ "$g41b_rc" -ne 0 ]; then
            echo "=== FAIL: Gate 4.1b rejected the effective-stress Biot form (rc=$g41b_rc) ==="
            echo "    Check /tmp/gate41b_verdict.log: E1 effective form active,"
            echo "    E2 displacement equivalence to superposition (relL2<=1e-3),"
            echo "    E3 production unchanged (no stress diagnostic),"
            echo "    E4 forms mutually exclusive."
            exit 1
          fi
          echo "=== Gate 4.1b PASS: effective-stress form active, displacement matches superposition, mutually exclusive with body force ==="
          # Only Flow/TS and process-level fatal signatures are hard failures.
          # 'SNESolve failed' / 'error code meaning' were removed: they made
          # #58 red even though the transient Darcy solve fully succeeded.
          FATAL_RE='segmentation fault|signal 11|Caught signal|MPI_ABORT|attempt to deallocate|PETSC ERROR|error while loading shared libraries|TSSolve failed|TSConvergedReason -[1-9]|KSP_DIVERGED|DIVERGED_|not converged'
          if grep -Eiq "$FATAL_RE" /tmp/terzaghi.log; then
            echo "=== runtime failure signature detected in /tmp/terzaghi.log ==="
            grep -Ein "$FATAL_RE" /tmp/terzaghi.log | head -20
            exit 1
          fi
          if ! grep -q "Gate 3.1: transient Darcy TS created" /tmp/terzaghi.log; then
            echo "=== FAIL: transient TS path was NOT activated (yaml enum mismatch?) ==="
            grep -n "Gate 3.1: flow enum" /tmp/terzaghi.log | head -4 || true
            exit 1
          fi
          if ! grep -q "Gate 3.1: step" /tmp/terzaghi.log; then
            echo "=== FAIL: TSSolve never advanced (no per-step TS log) ==="
            exit 1
          fi
          # --- Gate 3.1 POSITIVE assertions (CI #58: rc=0 alone is not enough) ---
          if [ "$rc" -ne 0 ]; then
            echo "=== FAIL: Terzaghi mpirun returned non-zero exit code $rc ==="
            exit 1
          fi
          nSolve=$(grep -c "post-TSSolve" /tmp/terzaghi.log || true)
          nSkip=$(grep -c "TSSolve skipped" /tmp/terzaghi.log || true)
          echo "=== Gate 3.1: $nSolve completed TSSolve calls, $nSkip skipped (51 outer steps) ==="
          # CI #58: 49 solves + 2 skips (step 1 zero-length interval, plus one
          # floating-point boundary where TS time == time(step) at step 16).
          # The step-16 skip is a known time-axis artifact to be corrected
          # before the hard Terzaghi comparison; it must not hide a real hang.
          if [ "$nSolve" -lt 48 ]; then
            echo "=== FAIL: transient TS did not advance through the time loop ==="
            exit 1
          fi
          if ! grep -Eq "TS dt [0-9.]+ time 1(\.0+)? *$" /tmp/terzaghi.log; then
            echo "=== FAIL: -flow_ts_monitor never reached final time t=1 ==="
            grep -n "TS dt" /tmp/terzaghi.log | tail -5 || true
            exit 1
          fi
          badSteps=$(grep "total number of rejected steps=" /tmp/terzaghi.log | grep -vc "=0" || true)
          if [ "$badSteps" -gt 0 ]; then
            echo "=== FAIL: TS reported $badSteps views with rejected steps ==="
            exit 1
          fi
          out=data/Beam1x10-tri3_out.gen
          if [ ! -s "$out" ]; then
            echo "=== FAIL: result mesh $out missing or empty ==="
            exit 1
          fi
          out_magic=$(head -c 3 "$out" | od -An -tx1 | tr -d ' \n')
          if [ "$out_magic" != "434446" ]; then
            echo "=== FAIL: result mesh $out is not NetCDF/Exodus (magic=$out_magic) ==="
            exit 1
          fi
          echo "=== Gate 3.1 PASS: transient Darcy TS advanced to t=1, no rejected steps, $out is a valid Exodus file ==="
          # --- Gate 3.2 probe: pressure envelope pmax(z=bottom,t) ---
          # Informational this round: hard analytical comparison is added once
          # the real decay curve is confirmed (vDef emits one line per step).
          nProbe=$(grep -c "Gate 3.2:" /tmp/terzaghi.log || true)
          echo "=== Gate 3.2 probe: $nProbe pressure envelopes ==="
          if [ "$nProbe" -ge 50 ]; then
            pFirst=$(grep "Gate 3.2:" /tmp/terzaghi.log | head -1 | awk '{print $NF}')
            pLast=$(grep "Gate 3.2:" /tmp/terzaghi.log | tail -1 | awk '{print $NF}')
            echo "=== Gate 3.2 probe: first step pmax=$pFirst ; final step pmax=$pLast ==="
            awk -v a="$pFirst" -v b="$pLast" 'BEGIN{r=(a!=0)?b/a:0; printf "=== Gate 3.2 probe: pmax(final)/pmax(initial)=%.4f ; decay-to-half=%s ===\n", r, (r<0.5?"YES":"NO")}'
            # CI #59: a green 3.1 with an exponentially growing pressure is a
            # FALSE green. Make the physics a hard gate now that the probe exists.
            ratio=$(awk -v a="$pFirst" -v b="$pLast" 'BEGIN{printf "%.6g",(a!=0)?b/a:0}')
            if awk -v r="$ratio" 'BEGIN{exit !(r>1.5)}'; then
              echo "=== FAIL: Gate 3.2 pressure DIVERGED (pmax final/initial=$ratio > 1.5) ==="
              echo "    IFunction / IJacobian or the DM dof mapping is inconsistent."
              grep "Gate 3.2 diag:" /tmp/terzaghi.log | head -10 || true
              exit 1
            fi
            # CI #66: with one fixed-dt BE step per outer step the FE solution
            # is ratio=0.0934 (continuum Terzaghi 0.0871). Tighten the loose
            # divergence-sanity band into a real analytic comparison; the
            # hard "ratio > 1.5 DIVERGED" rule above is kept unchanged.
            if awk -v r="$ratio" 'BEGIN{exit !(r>=0.05 && r<=0.15)}'; then
              echo "=== Gate 3.2 PASS: Terzaghi decay ratio $ratio in [0.05,0.15] (FE/BE 0.0934, analytic 0.0871) ==="
            else
              echo "=== FAIL: Gate 3.2 decay ratio $ratio outside analytic band [0.05,0.15] ==="
              echo "    expected FE/BE 0.0934 (continuum Terzaghi 0.0871)."
              grep "Gate 3.2:" /tmp/terzaghi.log | awk 'NR==1 || NR%10==0' | head -8 || true
              exit 1
            fi
            # --- CI #67: TRUE analytic comparison + output metadata check ---
            # Backward-Euler-corrected Terzaghi series at the closed end z=0,
            # t=1 s: cv=(k/mu)/S=108.695652 m2/s, H=10 m, dt=0.02 s, n=50.
            # Every mode decays as (1+lambda_m*dt)^(-n) instead of
            # exp(-lambda_m*t). Pure awk: no numpy/scipy on the runner, and
            # 200 modes is far beyond convergence at t=1.
            expected=$(awk 'BEGIN{pi=atan2(0,-1); cv=(5.0e-11/1.0e-3)/4.6e-10; H=10.0; dt=0.02; n=50; s=0.0; for(m=0;m<200;m++){k=2*m+1; lam=cv*(k*pi/(2.0*H))^2; a=(4.0/pi)*((m%2==0)?1.0:-1.0)/k; s+=a*exp(-n*log(1.0+lam*dt))} printf "%.8f",s}')
            echo "=== Gate 3.2: BE-corrected analytic p/p0(t=1)=$expected ; FEM ratio=$ratio ==="
            if awk -v r="$ratio" -v e="$expected" 'BEGIN{d=r-e; if(d<0)d=-d; exit !(d<=0.02)}'; then
              echo "=== Gate 3.2 PASS: |FEM - BE analytic| <= 0.02 (time axis aligned, CI #67) ==="
            else
              echo "=== FAIL: Gate 3.2 FEM ratio deviates from the BE analytic solution by > 0.02 ==="
              echo "    A ratio near 0.124 means the initial Dirichlet BC was NOT applied."
              exit 1
            fi
            # CI #68: verify the COMPLETE nodal variable table and report every
            # slot's value range. Before CI #68 Flow's boundaryPressureOffset=3
            # overwrote DefMech's Displacement_X on every ViewEXO call
            # (DefMech is written first, Flow second). Both readers are pure
            # standard library and committed under vDef/data.
            python3 data/check_exodus_metadata.py "$out" || exit 1
            echo "=== Gate 3.2 probe: every 10th step pmax ==="
            grep "Gate 3.2:" /tmp/terzaghi.log | awk 'NR==1 || NR%10==0' | head -8
          fi
          # CI #84: retire the CI #71 l2/ksponly variant loop. Its ksponly
          # branch now duplicates the production solver, its l2 branch is a
          # ruled-out hypothesis that can burn the full 600 s cap, and
          # diagnose_snes.py renders a ksponly run (no fnorm samples) as a
          # 0.000e+00 "converged" row -- the CI #73 false-convergence trap.
          # The same-source determinism check now lives in KSPONLY-PHYS above
          # and is judged by the physical field (P7), not by fnorm placeholders.
          exit $rc
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics
          path: |
            /tmp/MEF90.log
            /tmp/m_DefMech.log
            /tmp/m_HeatXfer.log
            /tmp/flow.log
            /tmp/vDef.log
            /tmp/ldd-vDef.log
            /tmp/terzaghi.log
            /tmp/terzaghi_ksponly_phys.log
            /tmp/terzaghi_nobiot.log
            /tmp/terzaghi_bodyforce.log
            /tmp/terzaghi_advection.log
            /tmp/terzaghi_noadvection.log
            /tmp/terzaghi_verdict.log
            /tmp/gate33_verdict.log
            /tmp/gate41_verdict.log
            /tmp/gate42_verdict.log
            /tmp/gate43_verdict.log
            /tmp/gate41b_verdict.log
            /tmp/terzaghi_stress.log
            /tmp/out_stress.gen
            /tmp/out_main.gen
            /tmp/out_ksponly.gen
            /tmp/out_nobiot.gen
            /tmp/out_bodyforce.gen
            /tmp/out_advection.gen
            /tmp/out_noadvection.gen
          retention-days: 7
      - name: Upload Terzaghi result mesh
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terzaghi-out-gen
          path: vDef/data/Beam1x10-tri3_out.gen
          if-no-files-found: warn
          retention-days: 7
      - name: Save cache OpenMPI
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/openmpi-3.1.3
          key: openmpi-3.1.3-ubuntu-latest-v1
      - name: Save cache PETSc deps
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/petsc-dl
          key: petsc-dl-v1
      - name: Save cache Miniconda + PETSc build
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/miniconda2
            ~/petsc-3.3-mef90
          key: petsc-mef90-3.3-ubuntu-latest-v1
